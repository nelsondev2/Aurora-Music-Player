# Integración continua: pruebas, auditoría i18n, cobertura y npm audit.
# No hay build: la app se sirve tal cual.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Auditoría i18n (364 claves × 8 idiomas)
        run: npm run lint
      - name: Suite completa (unit, integración, a11y, e2e)
        run: npm test
      - name: npm audit (sin vulnerabilidades)
        run: npm run audit
      - name: Cobertura
        if: matrix.node == '22'
        run: npm run test:coverage
      - name: Publicar informe de cobertura
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 14
