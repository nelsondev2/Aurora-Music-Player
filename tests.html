<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aurora tests</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      padding: 32px 20px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #050509;
      color: #f5f5f8;
    }
    main { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 22px; letter-spacing: -0.03em; margin: 0 0 8px; }
    .lead { color: rgba(255,255,255,0.55); font-size: 14px; margin-bottom: 20px; }
    #summary { font-weight: 800; margin-bottom: 16px; }
    #results { list-style: none; padding: 0; margin: 0; }
    #results li {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 13px;
      line-height: 1.45;
      padding: 8px 10px;
      border-radius: 8px;
      margin-bottom: 6px;
      background: rgba(255,255,255,0.04);
    }
    .ok { color: #34d399; }
    .fail { color: #f87171; }
    a { color: #c084fc; }
  </style>
</head>
<body>
  <main>
    <h1>Aurora · tests</h1>
    <p class="lead">Sin framework. Cubre <code>parseLrc</code>, shuffle Fisher–Yates, i18n (8 idiomas), <code>fmtTime</code> y duplicados.</p>
    <p id="summary">Ejecutando…</p>
    <ol id="results"></ol>
    <p class="lead">CLI i18n: <code>node audit-i18n.js</code></p>
  </main>
  <script src="data.js"></script>
  <script src="js/state.js"></script>
  <script src="js/player-ui.js"></script>
  <script src="js/lyrics.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/library.js"></script>
  <script src="tests.js"></script>
</body>
</html>
